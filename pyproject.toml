[tool.poetry]
name = "pdv"
version = "0.0.1"
description = ""
authors = ["Gilderlan Silva da Cruz and Gilvan Candido"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
python-jose = { extras = ["cryptography"], version = ">=3.5.0,<4.0.0" }
tortoise-orm = "^0.25.1"

[tool.poetry.group.dev.dependencies]
fastapi = { extras = ["all"], version = "^0.116.1" }
sqlmodel = "^0.0.24"
python-dotenv = "^1.1.1"
passlib = "^1.7.4"
jwt = "^1.4.0"
pandas = "^2.3.1"
requests = "^2.32.4"
bcrypt = "^4.3.0"
black = "^25.1.0"
isort = "^6.0.1"
validate-docbr = "^1.11.1"
pydantic-br = "^1.1.0"
faker = "^37.6.0"
matplotlib = "^3.10.6"
fpdf = "^1.7.2"
reportlab = "^4.4.3"
tortoise-orm = "^0.25.1"
qrcode = "^8.2"
crcmod = "^1.7"
redis = "^6.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 150
skip-string-normalization = true

[tool.isort]
profile = "black"
